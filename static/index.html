<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>GEO 智能体 - 普能达</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
    background: #F5F6F1; color: #14213A;
  }
  #app {
    display: flex; min-height: 100vh;
  }
  /* sidebar */
  #sidebar {
    width: 210px; background: #fff; border-right: 1px solid #E4E6DE;
    padding: 18px 12px; flex-shrink: 0;
  }
  #sidebar .brand { display:flex; align-items:center; gap:8px; padding:0 8px; margin-bottom:16px; font-weight:700; font-size:15px; }
  #sidebar .brand .dot { width:10px; height:10px; border-radius:50%; background:#B23A2E; }
  #market-switch { display:flex; border:1px solid #D9DCD3; border-radius:8px; padding:2px; margin-bottom:18px; }
  #market-switch button { flex:1; border:none; border-radius:6px; padding:6px 0; font-size:12px; cursor:pointer; background:transparent; color:#6B6E64; }
  #market-switch button.active { background:#14213A; color:#fff; }
  .nav-btn {
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    border:none; background:transparent; color:#6B6E64;
    padding:9px 10px; border-radius:8px; font-size:13px; cursor:pointer; margin-bottom:2px;
  }
  .nav-btn.active { background:#F5F6F1; color:#14213A; font-weight:600; }
  /* main */
  #main { flex:1; padding: 22px 24px; overflow-y: auto; }
  #breadcrumb { color:#6B6E64; font-size:12px; margin-bottom:18px; }
  .card { background:#fff; border:1px solid #E4E6DE; border-radius:12px; padding:18px; margin-bottom:16px; }
  .card h3 { font-size:13px; font-weight:600; margin:0 0 10px 0; }
  .empty { text-align:center; padding:40px 20px; color:#6B6E64; }
  .empty .title { font-size:14px; font-weight:600; color:#14213A; margin-bottom:4px; }
  .empty .note { font-size:12.5px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:8px; }
  .kpi-card { background:#fff; border:1px solid #E4E6DE; border-radius:12px; padding:14px 16px; }
  .kpi-label { font-size:12px; color:#6B6E64; margin-bottom:8px; }
  .kpi-value { font-family: "Consolas","SF Mono",monospace; font-size:24px; font-weight:700; color:#C7C9BF; }
  .hint { font-size:12px; color:#9A9C92; margin-bottom:16px; }
  input[type=text], input[type=password], textarea, select {
    width:100%; box-sizing:border-box; border:1px solid #D9DCD3; border-radius:8px;
    padding:9px 12px; font-size:14px; background:#fff; color:#14213A; outline:none; font-family:inherit;
  }
  textarea { resize: vertical; line-height:1.6; }
  .btn {
    background:#14213A; color:#fff; border:none; border-radius:8px; padding:10px 20px;
    font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  }
  .btn:disabled { background:#C7C9BF; cursor:not-allowed; }
  .btn-ghost {
    background:#fff; color:#14213A; border:1px solid #D9DCD3; border-radius:8px; padding:7px 14px;
    font-size:13px; cursor:pointer;
  }
  .platform-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; border:1px solid #E4E6DE; border-radius:8px; margin-bottom:6px; background:#fff;
  }
  .platform-row label { display:flex; align-items:center; gap:9px; font-size:13px; cursor:pointer; }
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:2px 9px; border-radius:999px; }
  .badge .d { width:6px; height:6px; border-radius:999px; }
  .badge-connected { background:#0E8C7F14; color:#0E8C7F; }
  .badge-connected .d { background:#0E8C7F; }
  .badge-not { background:#B23A2E10; color:#B23A2E; }
  .badge-not .d { background:#B23A2E; }
  .status-row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid #EFF0E9; font-size:13px; }
  .qa-block { border-top:1px solid #EFF0E9; padding:10px 0; font-size:13px; }
  .qa-block:first-of-type { border-top:none; }
  .qa-meta { color:#9A9C92; font-size:12px; margin-top:6px; }
  .banner-error {
    background:#B23A2E10; border:1px solid #B23A2E40; color:#B23A2E;
    border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:16px;
  }
  .type-tag { font-size:12px; padding:5px 11px; border-radius:999px; background:#F5F6F1; color:#14213A; margin:3px; display:inline-block; }
  .modal-overlay { position:fixed; inset:0; background:rgba(20,33,58,0.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:1000; }
  .modal-box { background:#fff; border-radius:12px; max-width:640px; width:100%; padding:22px; }
  .modal-box h3 { margin-top:0; }
  .kanban-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; align-items:start; overflow-x:auto; }
  .kanban-col { background:#F5F6F1; border-radius:10px; padding:10px; min-height:60px; }
  .kanban-col h4 { font-size:12px; margin:0 0 8px; color:#6B6E64; }
  .kanban-card { background:#fff; border:1px solid #E4E6DE; border-radius:8px; padding:10px; margin-bottom:8px; font-size:12.5px; cursor:pointer; }
  .form-row { margin-bottom:10px; }
  .form-row label { display:block; font-size:12px; color:#6B6E64; margin-bottom:4px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="brand"><span class="dot"></span> GEO 智能体</div>
    <div id="market-switch"></div>
    <div id="nav"></div>
  </div>
  <div id="main">
    <div id="breadcrumb"></div>
    <div id="content"></div>
  </div>
</div>

<script>
/* ---------------- 配置 ---------------- */
// 留空表示"和当前页面同一个源"——本页面本身就是FastAPI用StaticFiles托管出来的，
// 所以无论是本机 http://127.0.0.1:8000 还是部署后的公网域名，相对路径都能正确
// 命中同一个后端，不需要跟着部署环境手动改这个值。
const BACKEND_URL = "";

/* ---------------- 数据 ---------------- */
const NAV_ITEMS = [
  { id: "dashboard", label: "Dashboard" },
  { id: "quick", label: "快速诊断" },
  { id: "deep", label: "深度诊断" },
  { id: "tutorial", label: "GEO教程" },
  { id: "bank", label: "问题库" },
  { id: "competitors", label: "竞品分析" },
  { id: "citations", label: "引用来源" },
  { id: "content", label: "GEO内容矩阵" },
  { id: "history", label: "诊断历史" },
  { id: "reports", label: "报告" },
  { id: "platforms", label: "平台管理" },
  { id: "settings", label: "系统设置" },
];

const CN_PLATFORM_NAMES = ["豆包", "DeepSeek", "腾讯元宝", "Kimi", "百度AI", "通义千问", "夸克", "智谱清言"];
const GLOBAL_PLATFORM_NAMES = ["ChatGPT", "Google Gemini", "Perplexity", "Microsoft Copilot", "Claude"];

const QUESTION_TYPES_CN = ["品牌认知","品牌推荐","产品推荐","品牌对比","产品对比","厂家寻找","OEM","ODM","汽车主机厂配套","经销商采购","露营/户外场景","房车场景","自驾场景","产品使用","售后问题","采购决策"];
const QUESTION_TYPES_GLOBAL = ["Brand awareness","Brand recommendation","Product recommendation","Brand comparison","Product comparison","Manufacturer sourcing","OEM","ODM","Automotive OEM supply","Distributor procurement","Camping / outdoor","RV scenario","Road trip scenario","Product usage","After-sales","Purchase decision"];

const TIERS = [{id:"quick",label:"快速",count:20},{id:"standard",label:"标准",count:50},{id:"deep",label:"深度",count:100}];

// 深度诊断的问题类型UI沿用已有的 questionTypes 标签（不新增页面/不改布局），
// 提交给后端时翻译成 diagnosis_analyzer 的 Query Intent 编码。
// 未选择任何类型时不传 intents，后端按默认分布抽题（B2B高价值Query占较高比例）。
const DEEP_INTENT_MAP = {
  "品牌认知": "consumer_brand", "品牌推荐": "consumer_brand",
  "产品推荐": "consumer_product",
  "品牌对比": "comparison", "产品对比": "comparison",
  "厂家寻找": "manufacturer", "OEM": "OEM", "ODM": "ODM",
  "汽车主机厂配套": "automotive_supplier", "经销商采购": "distributor_procurement",
  "露营/户外场景": "usage", "房车场景": "usage", "自驾场景": "usage", "产品使用": "usage",
  "售后问题": "after_sales", "采购决策": "distributor_procurement",
};

const INTENT_LABELS_CN = {
  consumer_brand: "C端品牌", consumer_product: "C端产品", manufacturer: "厂家寻找",
  OEM: "OEM", ODM: "ODM", automotive_supplier: "主机厂/配套",
  distributor_procurement: "经销商采购", technical: "技术问题", usage: "使用问题",
  after_sales: "售后问题", comparison: "对比问题", other: "其他",
};

function makePlatforms(names) {
  return names.map((name, i) => ({
    id: name + "-" + i, name, status: "not_connected", connectMethod: "", enabled: true,
  }));
}

function initMarket(id) {
  if (id === "cn") {
    return {
      brand: { name: "普能达", site: "www.pnda.com.cn", industry: "车载冰箱", lang: "中文" },
      platforms: makePlatforms(CN_PLATFORM_NAMES),
      questionTypes: QUESTION_TYPES_CN,
      quickQuestions: "车载冰箱哪个品牌好？",
      deepTier: "quick",
      deepCategories: new Set(),
      competitors: [],
    };
  }
  return {
    brand: { name: "PUNEDA", site: "", industry: "Portable Refrigerator / Car Refrigerator", lang: "英文" },
    platforms: makePlatforms(GLOBAL_PLATFORM_NAMES),
    questionTypes: QUESTION_TYPES_GLOBAL,
    quickQuestions: "Which car refrigerator brand is best?",
    deepTier: "quick",
    deepCategories: new Set(),
    competitors: [],
  };
}

const state = {
  market: "cn",
  page: "dashboard",
  data: { cn: initMarket("cn"), global: initMarket("global") },
  selectedQuick: new Set(),
  selectedDeep: new Set(),
  backendReachable: null,   // null=未知, true/false
  quickResults: null,       // {questions:[...], resultsByQuestion: {q: [{platform, ...}]}}
  quickRunning: false,
  deepMessages: null,
  deepRunning: false,
  deepProgress: null,       // {runId, total, done, success, failed, currentQuestion, items:[]}
  deepReport: null,         // {run, report, items} 最近一次刚跑完的深度诊断
  deepItemsFilter: "all",
  dashboardLatest: null,    // {run, report, items} | {run:null} 最新一次已完成的深度诊断
  historyRuns: null,        // 诊断历史列表
  historyDetail: null,      // 点开的某一次历史详情 {run, report, items}
  tutorialData: null,       // {run, tutorial:{basics, personalized, has_diagnosis_data}}

  // ---- GEO内容矩阵 ----
  contentMeta: null,        // {content_clusters, content_types, statuses, priorities, index_statuses, retest_statuses}
  contentDashboard: null,   // /api/content/dashboard 的返回
  contentTasks: null,       // 当前筛选条件下的任务列表
  contentFilters: {
    priority: "", status: "", content_cluster: "", query_intent: "",
    commercial_value: "", geo_gap: "", retest_status: "", search: "",
  },
  contentView: "list",      // "list" | "kanban"
  contentTaskDetail: null,  // 当前打开的任务详情 {task}
  contentPreview: null,     // "加入内容矩阵"预览弹窗状态 {suggestion, similar_tasks, editedFields}
  contentBatch: null,       // "生成内容矩阵建议"批量弹窗状态 {diagnosisId, suggestions, selected:Set}
  contentRetestRunning: false,
  contentMessages: null,
};
// 默认全选所有平台
state.selectedQuick = new Set(state.data.cn.platforms.map(p => p.id));
state.selectedDeep = new Set(state.data.cn.platforms.map(p => p.id));

function d() { return state.data[state.market]; }

/* ---------------- 与后端通信 ---------------- */

async function checkDeepSeekStatus() {
  try {
    const res = await fetch(BACKEND_URL + "/api/platforms/deepseek/status");
    if (!res.ok) throw new Error("状态码 " + res.status);
    const data = await res.json();
    state.backendReachable = true;
    // 只对中国市场生效，把 DeepSeek 状态改成真实结果
    const p = state.data.cn.platforms.find(p => p.name === "DeepSeek");
    if (p) p.status = data.configured ? "connected" : "not_connected";
  } catch (e) {
    state.backendReachable = false;
  }
  render();
}

async function askDeepSeek(question) {
  const res = await fetch(BACKEND_URL + "/api/ask/deepseek", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question }),
  });
  if (!res.ok) {
    let detail = "请求失败（状态码 " + res.status + "）";
    try { const err = await res.json(); if (err.detail) detail = err.detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

async function diagnoseGeo(question, rawAnswer, model) {
  const res = await fetch(BACKEND_URL + "/api/diagnose/geo", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, raw_answer: rawAnswer, model }),
  });
  if (!res.ok) {
    let detail = "GEO诊断分析失败（状态码 " + res.status + "）";
    try { const err = await res.json(); if (err.detail) detail = err.detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json(); // { parsed, diagnosis }
}

async function deepStart(market, platform, intents, count) {
  const res = await fetch(BACKEND_URL + "/api/diagnose/deep/start", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ market, platform, intents: intents && intents.length ? intents : null, count }),
  });
  if (!res.ok) {
    let detail = "创建深度诊断任务失败（状态码 " + res.status + "）";
    try { const err = await res.json(); if (err.detail) detail = err.detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json(); // { run_id, questions: [{question, query_intent, commercial_value}, ...] }
}

async function deepSaveItem(runId, item) {
  const res = await fetch(BACKEND_URL + "/api/diagnose/deep/" + runId + "/item", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(item),
  });
  if (!res.ok) throw new Error("保存该题结果失败（状态码 " + res.status + "）");
  return res.json();
}

async function deepComplete(runId) {
  const res = await fetch(BACKEND_URL + "/api/diagnose/deep/" + runId + "/complete", { method: "POST" });
  if (!res.ok) throw new Error("汇总深度诊断结果失败（状态码 " + res.status + "）");
  return res.json(); // { run, report, items }
}

async function deepFetchRuns() {
  const res = await fetch(BACKEND_URL + "/api/diagnose/deep/runs");
  if (!res.ok) throw new Error("获取诊断历史失败（状态码 " + res.status + "）");
  return res.json(); // { runs: [...] }
}

async function deepFetchRunDetail(runId) {
  const res = await fetch(BACKEND_URL + "/api/diagnose/deep/runs/" + runId);
  if (!res.ok) throw new Error("获取诊断详情失败（状态码 " + res.status + "）");
  return res.json(); // { run, report, items }
}

async function deepFetchLatest() {
  const res = await fetch(BACKEND_URL + "/api/diagnose/deep/latest");
  if (!res.ok) throw new Error("获取最新深度诊断失败（状态码 " + res.status + "）");
  return res.json(); // { run, report, items }
}

async function fetchGeoTutorial() {
  const res = await fetch(BACKEND_URL + "/api/tutorial/geo");
  if (!res.ok) throw new Error("获取GEO教程失败（状态码 " + res.status + "）");
  return res.json(); // { run, tutorial: {basics, personalized, has_diagnosis_data} }
}

/* ---------------- GEO内容矩阵：与后端通信 ---------------- */

async function contentFetchMeta() {
  const res = await fetch(BACKEND_URL + "/api/content/meta");
  if (!res.ok) throw new Error("获取内容矩阵配置失败（状态码 " + res.status + "）");
  return res.json();
}

async function contentFetchDashboard() {
  const res = await fetch(BACKEND_URL + "/api/content/dashboard");
  if (!res.ok) throw new Error("获取内容矩阵Dashboard失败（状态码 " + res.status + "）");
  return res.json();
}

async function contentFetchTasks(filters) {
  const params = new URLSearchParams();
  Object.entries(filters || {}).forEach(([k, v]) => { if (v) params.set(k, v); });
  const qs = params.toString();
  const res = await fetch(BACKEND_URL + "/api/content/tasks" + (qs ? "?" + qs : ""));
  if (!res.ok) throw new Error("获取内容任务列表失败（状态码 " + res.status + "）");
  return res.json();
}

async function contentFetchTask(taskId) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks/" + taskId);
  if (!res.ok) throw new Error("获取内容任务详情失败（状态码 " + res.status + "）");
  return res.json();
}

async function contentFetchComparison(taskId) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks/" + taskId + "/comparison");
  if (!res.ok) throw new Error("获取复测对比失败（状态码 " + res.status + "）");
  return res.json();
}

async function contentCreateTask(payload) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "创建内容任务失败（状态码 " + res.status + "）"); }
  return res.json();
}

async function contentUpdateTask(taskId, payload) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks/" + taskId, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "更新内容任务失败（状态码 " + res.status + "）"); }
  return res.json();
}

async function contentDeleteTask(taskId) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks/" + taskId, { method: "DELETE" });
  if (!res.ok) throw new Error("删除内容任务失败（状态码 " + res.status + "）");
  return res.json();
}

async function contentSuggestFromDiagnosis(payload) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks/suggest-from-diagnosis", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "生成内容任务建议失败（状态码 " + res.status + "）"); }
  return res.json();
}

async function contentBatchSuggest(diagnosisId) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks/batch-suggest-from-diagnosis", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ diagnosis_id: diagnosisId }),
  });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "生成内容矩阵建议失败（状态码 " + res.status + "）"); }
  return res.json();
}

async function contentBatchCreate(suggestions) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks/batch-from-diagnosis", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ suggestions }),
  });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "批量创建内容任务失败（状态码 " + res.status + "）"); }
  return res.json();
}

async function contentRetest(taskId, results) {
  const res = await fetch(BACKEND_URL + "/api/content/tasks/" + taskId + "/retest", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ results }),
  });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.detail || "保存复测结果失败（状态码 " + res.status + "）"); }
  return res.json();
}

async function loadDashboardLatest() {
  try {
    state.dashboardLatest = await deepFetchLatest();
  } catch (e) {
    state.dashboardLatest = state.dashboardLatest || { run: null };
  }
  if (state.page === "dashboard") render();
}

async function loadHistoryList() {
  try {
    const data = await deepFetchRuns();
    state.historyRuns = data.runs;
  } catch (e) {
    state.historyRuns = state.historyRuns || [];
  }
  if (state.page === "history") render();
}

async function openHistoryDetail(runId) {
  try {
    state.historyDetail = await deepFetchRunDetail(runId);
  } catch (e) {
    state.historyDetail = null;
    state.deepMessages = ["加载诊断历史详情失败 — " + e.message];
  }
  render();
}
function closeHistoryDetail() { state.historyDetail = null; render(); }

async function loadTutorial() {
  try {
    state.tutorialData = await fetchGeoTutorial();
  } catch (e) {
    state.tutorialData = state.tutorialData || { run: null, tutorial: { basics: [], personalized: [], has_diagnosis_data: false } };
  }
  if (state.page === "tutorial") render();
}

/* ---------------- GEO内容矩阵：交互逻辑 ---------------- */

async function loadContentMatrix() {
  try {
    if (!state.contentMeta) state.contentMeta = await contentFetchMeta();
    state.contentDashboard = await contentFetchDashboard();
    const data = await contentFetchTasks(state.contentFilters);
    state.contentTasks = data.tasks;
  } catch (e) {
    state.contentMessages = ["加载GEO内容矩阵数据失败 — " + e.message];
  }
  if (state.page === "content") render();
}

function contentMetaLabel(kind, code) {
  if (!code) return "-";
  const meta = state.contentMeta;
  if (!meta) return code;
  const map = {
    cluster: meta.content_clusters, type: meta.content_types, status: meta.statuses,
    index_status: meta.index_statuses, retest_status: meta.retest_statuses,
  };
  const list = map[kind];
  const found = list && list.find(x => x.code === code);
  return found ? found.label : code;
}

async function runContentTaskRetest(taskId) {
  const task = state.contentTaskDetail.task;
  const queries = (task.target_queries && task.target_queries.length) ? task.target_queries : [task.target_query];
  state.contentRetestRunning = true;
  render();

  const results = [];
  for (const q of queries) {
    try {
      const askData = await askDeepSeek(q);
      const diagResult = await diagnoseGeo(q, askData.raw_answer, askData.model);
      results.push({
        query: q,
        brand_mentioned: diagResult.parsed.brand_mentioned,
        recommended: diagResult.parsed.recommended,
        rank: diagResult.parsed.rank,
        competitors: diagResult.parsed.competitors,
        citations: diagResult.parsed.citations,
      });
    } catch (e) {
      results.push({ query: q, brand_mentioned: null, recommended: null, rank: null, competitors: [], citations: [] });
    }
  }

  try {
    const res = await contentRetest(taskId, results);
    state.contentTaskDetail = { task: res.task, comparison: res.comparison };
    state.contentMessages = null;
  } catch (e) {
    state.contentMessages = ["复测失败 — " + e.message];
  }
  state.contentRetestRunning = false;
  await loadContentMatrix();
  render();
}

async function startQuick() {
  const cur = d();
  const questions = cur.quickQuestions.split("\n").map(s => s.trim()).filter(Boolean);
  const platforms = cur.platforms.filter(p => state.selectedQuick.has(p.id));
  if (questions.length === 0 || platforms.length === 0) return;

  state.quickRunning = true;
  state.quickResults = { questions, resultsByQuestion: {} };
  questions.forEach(q => { state.quickResults.resultsByQuestion[q] = platforms.map(p => ({ platform: p, phase: "pending" })); });
  render();

  for (const q of questions) {
    for (const entry of state.quickResults.resultsByQuestion[q]) {
      if (entry.platform.status !== "connected") {
        entry.phase = "skipped";
        render();
        continue;
      }
      entry.phase = "loading";
      render();
      try {
        const data = await askDeepSeek(q);
        entry.phase = "done";
        entry.answer = data.raw_answer;
        entry.model = data.model;
        entry.time = new Date().toLocaleString("zh-CN", { hour12: false });
        render();
        try {
          const result = await diagnoseGeo(q, data.raw_answer, data.model);
          entry.parsed = result.parsed;
          entry.diagnosis = result.diagnosis;
        } catch (e) {
          entry.parseError = e.message;
        }
      } catch (e) {
        entry.phase = "error";
        entry.error = e.message;
      }
      render();
    }
  }
  state.quickRunning = false;
  render();
}

async function startDeep() {
  const cur = d();

  if (cur.deepTier !== "quick") {
    state.deepMessages = ["本轮只真实开发了「快速 · 20题」深度诊断，标准/深度规模尚未开发。"];
    render();
    return;
  }

  const platforms = cur.platforms.filter(p =>
    state.selectedDeep.has(p.id) && p.status === "connected" && p.name === "DeepSeek"
  );
  if (platforms.length === 0) {
    state.deepMessages = ["请先勾选已连接的 DeepSeek 平台（本轮深度诊断仅支持 DeepSeek）。"];
    render();
    return;
  }

  const intents = Array.from(new Set(
    Array.from(cur.deepCategories).map(t => DEEP_INTENT_MAP[t]).filter(Boolean)
  ));

  state.deepMessages = null;
  state.deepReport = null;
  state.deepItemsFilter = "all";
  state.deepRunning = true;
  render();

  let started;
  try {
    started = await deepStart(state.market, "DeepSeek", intents, 20);
  } catch (e) {
    state.deepRunning = false;
    state.deepMessages = ["创建深度诊断任务失败 — " + e.message];
    render();
    return;
  }

  const { run_id, questions } = started;
  state.deepProgress = { runId: run_id, total: questions.length, done: 0, success: 0, failed: 0, currentQuestion: "" };
  render();

  const items = [];
  for (const q of questions) {
    state.deepProgress.currentQuestion = q.question;
    render();

    let item;
    try {
      const askData = await askDeepSeek(q.question);
      const diagResult = await diagnoseGeo(q.question, askData.raw_answer, askData.model);
      item = {
        question: q.question,
        query_intent: q.query_intent,
        commercial_value: q.commercial_value,
        platform: "DeepSeek",
        status: "success",
        raw_answer: askData.raw_answer,
        model: askData.model,
        tested_at: new Date().toLocaleString("zh-CN", { hour12: false }),
        brand_mentioned: diagResult.parsed.brand_mentioned,
        mention_count: diagResult.parsed.mention_count,
        recommended: diagResult.parsed.recommended,
        rank: diagResult.parsed.rank,
        competitors: diagResult.parsed.competitors,
        citations: diagResult.parsed.citations,
        answer_fit: diagResult.diagnosis.answer_fit,
        industry_knowledge_quality: diagResult.diagnosis.industry_knowledge_quality,
        gaps: diagResult.diagnosis.gaps,
        diagnosis_summary: diagResult.diagnosis.diagnosis_summary,
        observations: diagResult.diagnosis.observations,
        inferences: diagResult.diagnosis.inferences,
        actions: diagResult.diagnosis.action_items,
      };
      state.deepProgress.success += 1;
    } catch (e) {
      item = {
        question: q.question,
        query_intent: q.query_intent,
        commercial_value: q.commercial_value,
        platform: "DeepSeek",
        status: "failed",
        error_message: e.message,
      };
      state.deepProgress.failed += 1;
    }

    try { await deepSaveItem(run_id, item); } catch (e) { /* 单条保存失败不阻断剩余题目 */ }

    items.push(item);
    state.deepProgress.done += 1;
    render();
  }

  state.deepProgress.currentQuestion = "";
  let completed;
  try {
    completed = await deepComplete(run_id);
  } catch (e) {
    state.deepRunning = false;
    state.deepMessages = ["20题已全部执行完成，但汇总统计失败 — " + e.message];
    render();
    return;
  }

  state.deepReport = completed;
  state.deepRunning = false;
  render();
}

const ANSWER_FIT_LABELS = { good: "匹配", partial: "部分匹配", poor: "不匹配", unknown: "无法判断" };
const ANSWER_FIT_LEVELS = { good: "good", partial: "warn", poor: "bad", unknown: "neutral" };
const QUALITY_LABELS = { high: "高", medium: "中", low: "低", unknown: "无法判断" };
const QUALITY_LEVELS = { high: "good", medium: "warn", low: "bad", unknown: "neutral" };

function levelBadge(text, level) {
  const colors = {
    good:    { bg: "#0E8C7F14", fg: "#0E8C7F" },
    warn:    { bg: "#C7860714", fg: "#C78607" },
    bad:     { bg: "#B23A2E10", fg: "#B23A2E" },
    neutral: { bg: "#F5F6F1",   fg: "#6B6E64" },
  };
  const c = colors[level] || colors.neutral;
  return `<span class="badge" style="background:${c.bg};color:${c.fg};"><span class="d" style="background:${c.fg};"></span>${text}</span>`;
}

function sectionHeader(text) {
  return `<div style="font-weight:600;font-size:12.5px;color:#14213A;margin:14px 0 8px;padding-top:10px;border-top:1px dashed #EFF0E9;">【${text}】</div>`;
}

      ${levelBadge("行业知识质量：" + (QUALITY_LABELS[diag.industry_knowledge_quality] || diag.industry_knowledge_quality), QUALITY_LEVELS[diag.industry_knowledge_quality] || "neutral")}

function renderActionItems(items) {
  if (!items.length) {
    return `<span style="color:#9A9C92;font-size:12px;">暂无改善建议</span>`;
  }
  const priorityColor = { P1: "#B23A2E", P2: "#C78607", P3: "#6B6E64" };
  return items.map(a => {
    const c = priorityColor[a.priority] || "#6B6E64";
    return `
      <div style="border:1px solid #E4E6DE;border-radius:8px;padding:10px 12px;margin-bottom:8px;">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
          <span class="badge" style="background:${c}10;color:${c};"><span class="d" style="background:${c};"></span>${escapeHtml(a.priority)}</span>
          <span class="type-tag" style="margin:0;">${escapeHtml(a.action_type)}</span>
          ${a.affected_queries_count != null ? `<span style="font-size:12px;color:#9A9C92;">影响Query：${a.affected_queries_count}条</span>` : ""}
        </div>
        <div style="font-size:13px;margin-bottom:4px;">${escapeHtml(a.action)}</div>
        <div class="qa-meta" style="margin-top:0;">原因：${escapeHtml(a.reason)}</div>
      </div>
    `;
  }).join("");
}

function renderGapEvidence(gaps) {
  return gaps.map(g => `
    <div style="font-size:12.5px;padding:6px 0;border-bottom:1px solid #EFF0E9;">
      <b>${escapeHtml(g.label)}</b>：${escapeHtml(g.evidence)}
    </div>
  `).join("");
}

function renderDiagnosisBlock(entry, qIndex) {
  if (entry.parseError) {
    return `<div class="qa-meta" style="color:#B23A2E;">GEO诊断分析失败 — ${escapeHtml(entry.parseError)}</div>`;
  }
  if (!entry.parsed || !entry.diagnosis) {
    return `<div class="qa-meta">GEO诊断分析中…</div>`;
  }
  const parsed = entry.parsed, diag = entry.diagnosis;
  return `
    ${sectionHeader("基础结果")}
    ${renderBasicResult(parsed)}
    ${sectionHeader("GEO诊断")}
    ${renderGeoDiagnosisOverview(diag)}
    ${sectionHeader("诊断结论")}
    <div style="font-size:13px;line-height:1.7;">${escapeHtml(diag.diagnosis_summary)}</div>
    ${sectionHeader("改善建议")}
    ${renderActionItems(diag.action_items)}
    <div style="margin-top:8px;">
      <button class="btn-ghost" onclick="openContentPreviewFromQuickResult(${qIndex}, '${entry.platform.id}')">+ 加入内容矩阵</button>
    </div>
    ${sectionHeader("证据")}
    ${renderGapEvidence(diag.gaps)}
  `;
}

function openContentPreviewFromQuickResult(qIndex, platformId) {
  const question = state.quickResults && state.quickResults.questions[qIndex];
  const entry = findQuickEntry(qIndex, platformId);
  if (!question || !entry || !entry.parsed || !entry.diagnosis) return;
  openContentPreviewFromQuickDiagnosis(question, entry.parsed, entry.diagnosis);
}

function renderRawAnswerToggle(qIndex, entry) {
  const expanded = !!entry.showRaw;
  return `
    <div style="margin-top:14px;padding-top:10px;border-top:1px dashed #EFF0E9;">
      <a href="#" onclick="toggleRawAnswer(${qIndex},'${entry.platform.id}');return false;" style="font-size:12.5px;color:#6B6E64;">
        ${expanded ? "▲ 收起原始回答" : "▼ 查看原始回答"}
      </a>
      ${expanded ? `<div style="margin-top:8px;white-space:pre-wrap;font-size:13px;background:#F5F6F1;border-radius:8px;padding:10px 12px;">${escapeHtml(entry.answer)}</div>` : ""}
    </div>
  `;
}

function renderQuick() {
  const cur = d();
  let html = `
    <div class="card">
      <div class="kpi-label">核心问题（每行一个）</div>
      <textarea id="quick-questions" rows="4" oninput="d().quickQuestions=this.value">${cur.quickQuestions}</textarea>
      <div style="height:14px;"></div>
      <div class="kpi-label">选择AI平台（共${cur.platforms.length}个）</div>
      ${cur.platforms.map(p => `
        <div class="platform-row" style="opacity:${p.enabled?1:0.45}">
          <label>
            <input type="checkbox" ${state.selectedQuick.has(p.id)?'checked':''} ${p.enabled?'':'disabled'}
              onchange="toggleSelected(state.selectedQuick,'${p.id}')" />
            ${p.name}
          </label>
          ${badge(p.status)}
        </div>
      `).join("")}
      <div style="height:6px;"></div>
      <button class="btn" onclick="startQuick()" ${state.quickRunning?'disabled':''}>
        ${state.quickRunning ? "诊断中…" : "开始GEO诊断"}
      </button>
    </div>
  `;

  if (state.quickResults) {
    html += `<div class="hint">仅已连接平台会真实调用后端接口，其余平台会标注未执行原因。原始回答返回后会自动调用GEO诊断分析（结构化解析 + Query意图/回答匹配度/行业知识质量/Gap诊断），全部基于确定性规则，仅供参考，不构成完整GEO评分。</div>`;
    state.quickResults.questions.forEach((q, qIndex) => {
      html += `<div class="card"><div style="font-weight:600;font-size:13px;margin-bottom:6px;">问题：${escapeHtml(q)}</div>`;
      for (const entry of state.quickResults.resultsByQuestion[q]) {
        if (entry.phase === "skipped") {
          html += `<div class="qa-block"><b>${entry.platform.name}</b>：${badge(entry.platform.status)}</div>`;
        } else if (entry.phase === "pending") {
          html += `<div class="qa-block"><b>${entry.platform.name}</b>：等待中…</div>`;
        } else if (entry.phase === "loading") {
          html += `<div class="qa-block"><b>${entry.platform.name}</b>：正在请求 DeepSeek API…</div>`;
        } else if (entry.phase === "error") {
          html += `<div class="qa-block"><b>${entry.platform.name}</b>：<span style="color:#B23A2E;">请求失败 — ${escapeHtml(entry.error)}</span></div>`;
        } else if (entry.phase === "done") {
          html += `
            <div class="qa-block">
              <div><b>${entry.platform.name}</b> ${badge("connected")}</div>
              <div class="qa-meta">模型：${entry.model}　诊断时间：${entry.time}</div>
              ${renderDiagnosisBlock(entry, qIndex)}
              ${renderRawAnswerToggle(qIndex, entry)}
            </div>`;
        }
      }
      html += `</div>`;
    });
  }
  return html;
}

function renderDeepProgress(p) {
  const remaining = p.total - p.done;
  return `
    <div class="card">
      <div class="kpi-label">诊断进度</div>
      <div style="font-size:22px;font-weight:700;margin-bottom:8px;">${p.done} / ${p.total}</div>
      <div class="qa-meta" style="margin-top:0;">当前问题：${escapeHtml(p.currentQuestion || "—")}</div>
      <div style="display:flex;gap:18px;margin-top:10px;font-size:13px;">
        <span>成功：<b style="color:#0E8C7F;">${p.success}</b></span>
        <span>失败：<b style="color:#B23A2E;">${p.failed}</b></span>
        <span>剩余：<b>${remaining}</b></span>
      </div>
    </div>
  `;
}

function toggleInlinePanel(id) {
  const el = document.getElementById(id);

}

function renderHighValueSection(hv) {
  return `
    <div class="card">

        <span class="badge" style="background:#F5F6F1;color:#14213A;">品牌推荐率：${hv.recommend_rate != null ? hv.recommend_rate + "%" : "无数据"}</span>

      ${hv.uncovered_questions.length ? `

function renderQueryIntentDistribution(dist) {

  return `<div class="card"><h3>Query Intent 分布</h3>
    ${entries.length

function renderDeepItemCard(it, idx) {
  if (it.status === "failed") {
    return `<div class="qa-block"><b>${escapeHtml(it.question)}</b>　<span style="color:#B23A2E;">执行失败 — ${escapeHtml(it.error_message || "")}</span></div>`;
  }
  const mentionBadge = it.brand_mentioned
    ? `<span class="badge badge-connected"><span class="d"></span>已提及</span>`
    : `<span class="badge badge-not"><span class="d"></span>未提及</span>`;
  const recBadge = it.recommended
    ? `<span class="badge badge-connected"><span class="d"></span>推荐</span>`
    : `<span class="badge badge-not"><span class="d"></span>未推荐</span>`;
  const rankText = it.rank != null ? `第 ${it.rank} 位` : "无法判断";
  const hvTag = it.commercial_value === "high" ? `<span class="type-tag" style="background:#B23A2E10;color:#B23A2E;">High Value</span>` : "";
  const gapLabels = (it.gaps || []).map(g => escapeHtml(g.label)).join("、") || "无";
  const rawId = "deep-raw-" + idx;

  return `
    <div class="qa-block">
      <div style="font-weight:600;font-size:13px;">${escapeHtml(it.question)}</div>
      <div class="qa-meta" style="margin-top:4px;">${escapeHtml(INTENT_LABELS_CN[it.query_intent] || it.query_intent || "-")}　商业价值：${escapeHtml(it.commercial_value || "-")} ${hvTag}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;">
        ${mentionBadge}${recBadge}
        <span class="badge" style="background:#F5F6F1;color:#6B6E64;">排名：${rankText}</span>
      </div>
      <div class="qa-meta" style="margin-top:0;">高置信度竞品：${(it.competitors || []).length ? escapeHtml(it.competitors.map(competitorDisplayName).join("、")) : "未识别到高置信度竞品"}</div>
      <div class="qa-meta" style="margin-top:0;">引用来源：${(it.citations || []).length} 个</div>
      <div class="qa-meta" style="margin-top:0;">GEO Gap：${gapLabels}</div>
      <div style="font-size:13px;margin-top:6px;line-height:1.6;">${escapeHtml(it.diagnosis_summary || "")}</div>
      ${(it.actions && it.actions.length) ? `<div style="margin-top:6px;">${renderActionItems(it.actions)}</div>` : ""}
      <div style="margin-top:8px;">
        <button class="btn-ghost" onclick="openContentPreviewFromDeepItem(${it.diagnosis_id}, ${it.id})">+ 加入内容矩阵</button>
      </div>
      <a href="#" onclick="toggleInlinePanel('${rawId}');return false;" style="font-size:12px;color:#6B6E64;display:inline-block;margin-top:6px;">▼ 查看原始回答</a>
      <div id="${rawId}" style="display:none;margin-top:6px;white-space:pre-wrap;font-size:12.5px;background:#F5F6F1;border-radius:8px;padding:8px 10px;">${escapeHtml(it.raw_answer || "")}</div>
    </div>
  `;
}

function setDeepItemsFilter(f) { state.deepItemsFilter = f; render(); }

function renderDeepItemsList(items, gapsTop) {
  const filter = state.deepItemsFilter || "all";
  let filtered = items;
  if (filter === "mentioned") filtered = items.filter(it => it.status === "success" && it.brand_mentioned);
  else if (filter === "not_mentioned") filtered = items.filter(it => it.status === "success" && !it.brand_mentioned);
  else if (filter === "high_value") filtered = items.filter(it => it.commercial_value === "high");
  else if (filter.startsWith("gap:")) {
    const gapType = filter.slice(4);
    filtered = items.filter(it => (it.gaps || []).some(g => g.type === gapType));
  }

  const gapOptions = gapsTop.map(g => `<option value="gap:${g.type}" ${filter === "gap:" + g.type ? "selected" : ""}>${escapeHtml(g.label)}</option>`).join("");

  return `
    <div class="card">
      <h3>20题明细（${filtered.length} / ${items.length}）</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">
        <button class="btn-ghost" style="${filter==='all'?'border-color:#14213A;':''}" onclick="setDeepItemsFilter('all')">全部</button>
        <button class="btn-ghost" style="${filter==='mentioned'?'border-color:#14213A;':''}" onclick="setDeepItemsFilter('mentioned')">已提及</button>
        <button class="btn-ghost" style="${filter==='not_mentioned'?'border-color:#14213A;':''}" onclick="setDeepItemsFilter('not_mentioned')">未提及</button>
        <button class="btn-ghost" style="${filter==='high_value'?'border-color:#14213A;':''}" onclick="setDeepItemsFilter('high_value')">High Value</button>
        <select onchange="setDeepItemsFilter(this.value)" style="width:auto;padding:6px 10px;font-size:12.5px;">
          <option value="">按 Gap 类型筛选…</option>
          ${gapOptions}
        </select>
      </div>
      ${filtered.map((it, idx) => renderDeepItemCard(it, idx)).join("") || `<div class="qa-meta">没有符合筛选条件的问题。</div>`}
    </div>
  `;
}

function renderDeepReport(run, report, items) {
  const s = report.stats;
  const kpi = (label, value) => `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value" style="color:#14213A;">${value}</div></div>`;
  let html = `
    <div class="kpi-grid">
      ${kpi("扫描问题数", s.total_questions)}
      ${kpi("成功/失败", s.success_count + " / " + s.failed_count)}
      ${kpi("品牌提及率", s.brand_mention_rate != null ? s.brand_mention_rate + "%" : "--")}
      ${kpi("品牌推荐率", s.recommend_rate != null ? s.recommend_rate + "%" : "--")}
      ${kpi("Top3出现率", s.top3_rate != null ? s.top3_rate + "%" : "--")}
      ${kpi("平均排名", s.avg_rank != null ? s.avg_rank : "--")}
      ${kpi("Citation Rate", s.citation_rate != null ? s.citation_rate + "%" : "--")}
    </div>
  `;
  html += `<div class="card">
    <h3>GEO内容矩阵</h3>
    <div class="qa-meta" style="margin-top:0;">把这次诊断里相似的未覆盖Query自动聚合成少量内容任务建议（不是逐题生成），勾选后批量加入内容矩阵。</div>
    <div style="margin-top:10px;"><button class="btn" onclick="openBatchSuggestModal(${run.id})">生成内容矩阵建议</button>
    <button class="btn-ghost" onclick="viewContentTasksForDiagnosis(${run.id})" style="margin-left:8px;">查看本次生成的内容任务</button></div>
  </div>`;
  html += renderHighValueSection(report.high_value);
  html += renderGapsTopSection(report.gaps_top);
  html += renderCompetitorsTopSection(report.competitors_top);
  html += `<div class="card"><h3>改善建议（已去重聚合）</h3>${
    report.action_items.length ? renderActionItems(report.action_items) : `<div class="qa-meta">暂无改善建议。</div>`
  }</div>`;
  html += renderQueryIntentDistribution(report.query_intent_distribution);
  html += renderDeepItemsList(items, report.gaps_top);
  return html;
}

  const cur = d();
  let html = `
    <div class="card">
      <div class="kpi-label">诊断规模</div>
      <div style="display:flex;gap:8px;margin-bottom:16px;">
        ${TIERS.map(t => `<button class="btn-ghost" style="border-color:${cur.deepTier===t.id?'#14213A':'#D9DCD3'};background:${cur.deepTier===t.id?'#14213A0A':'#fff'};" onclick="cur_deepTier('${t.id}')">${t.label} · ${t.count}题</button>`).join("")}
      </div>

      </div>
      <div class="kpi-label">选择AI平台（共${cur.platforms.length}个，本轮仅支持DeepSeek真实调用）</div>
      ${cur.platforms.map(p => `
        <div class="platform-row" style="opacity:${p.enabled?1:0.45}">

      `).join("")}
      <div style="height:6px;"></div>

  if (state.deepMessages) {

  if (state.deepProgress && (state.deepRunning || !state.deepReport)) {

function renderContentOutline(outline) {
  if (!outline || !outline.length) return `<div class="qa-meta">暂无大纲</div>`;
  return outline.map(sec => {
    const indent = sec.level === "H1" ? 0 : sec.level === "H2" ? 16 : 32;
    const size = sec.level === "H1" ? 14 : 13;
    const weight = sec.level === "H1" ? 700 : sec.level === "H2" ? 600 : 400;
    return `<div style="padding:4px 0;margin-left:${indent}px;font-size:${size}px;font-weight:${weight};">
      <span style="color:#9A9C92;font-size:11px;margin-right:6px;">${sec.level}</span>${escapeHtml(sec.text)}
    </div>`;
  }).join("");
}

function renderContentEntityFacts(task) {
  const facts = task.entity_facts || [];
  return `
    <div class="qa-meta" style="margin-top:0;">需要核实的企业事实</div>
    <div style="margin:4px 0 10px;">
      ${(task.facts_required || []).length
        ? task.facts_required.map(f => {
            const existing = facts.find(x => x.name === f);
            const status = existing && existing.verified ? "已验证" : (existing && existing.content ? "待验证" : "待人工补充/核实");
            const color = existing && existing.verified ? "#0E8C7F" : "#C78607";
            return `<div style="font-size:13px;padding:5px 0;border-bottom:1px solid #EFF0E9;display:flex;justify-content:space-between;">

          }).join("")

      <button class="btn-ghost" onclick="addEntityFact(${task.id})">保存</button>

function addEntityFact(taskId) {
  const name = document.getElementById(`fact-name-${taskId}`).value.trim();
  const content = document.getElementById(`fact-content-${taskId}`).value.trim();
  const source = document.getElementById(`fact-source-${taskId}`).value.trim();
  if (!name) return;
  const task = state.contentTaskDetail.task;
  const facts = (task.entity_facts || []).filter(f => f.name !== name);
  facts.push({ name, content, source, verified: !!content });
  updateContentTaskField(taskId, { entity_facts: facts });
}

    ${sectionHeader("发布管理")}
    <div class="form-row"><label>目标URL</label><input type="text" value="${escapeHtml(task.target_url||"")}" onchange="updateContentTaskField(${task.id}, {target_url:this.value})" /></div>
    <div class="form-row"><label>实际发布URL</label><input type="text" value="${escapeHtml(task.published_url||"")}" onchange="updateContentTaskField(${task.id}, {published_url:this.value, status:'published'})" /></div>
    <div class="qa-meta" style="margin-top:0;">发布时间：${task.published_at || "未发布"}</div>
  </div>`;

  html += `<div class="card">
    ${sectionHeader("收录管理")}
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <select style="width:auto;" onchange="updateContentTaskField(${task.id}, {index_status:this.value})">
        ${(state.contentMeta ? state.contentMeta.index_statuses : []).map(s => `<option value="${s.code}" ${task.index_status===s.code?"selected":""}>${escapeHtml(s.label)}</option>`).join("")}
      </select>
      <span class="qa-meta" style="margin:0;">检查时间：${task.index_checked_at || "未检查"}</span>
    </div>
    <div class="form-row" style="margin-top:8px;"><label>备注</label><input type="text" value="${escapeHtml(task.index_notes||"")}" onchange="updateContentTaskField(${task.id}, {index_notes:this.value})" /></div>
  </div>`;

  html += `<div class="card">
    ${sectionHeader("复测管理")}
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      ${["7","14","30"].map(d => `<button class="btn-ghost" onclick="scheduleContentRetest(${task.id}, ${d})">${d}天后复测</button>`).join("")}
      <input type="text" id="retest-custom-${task.id}" placeholder="自定义日期 YYYY-MM-DD" style="width:auto;" />
      <button class="btn-ghost" onclick="scheduleContentRetestCustom(${task.id})">设置</button>
    </div>
    <div class="qa-meta" style="margin-top:8px;">复测截止日期：${task.retest_due_at || "未设置"}　状态：${contentMetaLabel("retest_status", task.retest_status)}</div>
    <div style="margin-top:10px;">
      <button class="btn" onclick="runContentTaskRetest(${task.id})" ${state.contentRetestRunning ? "disabled" : ""}>
        ${state.contentRetestRunning ? "复测中…" : "一键复测（真实调用DeepSeek）"}
      </button>
    </div>
    ${retestPerQuery.length ? `<div class="qa-meta" style="margin-top:10px;">最近一次复测明细</div>${retestPerQuery.map(q=>`<div style="font-size:12.5px;padding:3px 0;">· ${escapeHtml(q.query)}：${q.brand_mentioned?"已提及":"未提及"}${q.rank!=null?"　第"+q.rank+"位":""}</div>`).join("")}` : ""}
  </div>`;

  if (comparison) {
    const verdictColor = comparison.verdict === "结果改善" ? "#0E8C7F" : comparison.verdict === "结果下降" ? "#B23A2E" : "#6B6E64";
    html += `<div class="card">
      ${sectionHeader("发布前 vs 复测后对比")}
      <div style="display:flex;gap:20px;flex-wrap:wrap;">
        <div>
          <div class="qa-meta" style="margin-top:0;">发布前</div>
          <div style="font-size:13px;">提及：${comparison.baseline_mentioned_count}/${comparison.total_queries}　推荐：${comparison.baseline_recommended_count}/${comparison.total_queries}</div>
        </div>
        <div>
          <div class="qa-meta" style="margin-top:0;">复测后</div>
          <div style="font-size:13px;">提及：${comparison.retest_mentioned_count}/${comparison.total_queries}　推荐：${comparison.retest_recommended_count}/${comparison.total_queries}</div>
        </div>
      </div>
      <div style="margin-top:10px;"><span class="badge" style="background:${verdictColor}10;color:${verdictColor};"><span class="d" style="background:${verdictColor};"></span>${comparison.verdict}</span></div>
    </div>`;
  }

  html += `<div class="card">${sectionHeader("备注")}
    <textarea rows="3" onchange="updateContentTaskField(${task.id}, {notes:this.value})">${escapeHtml(task.notes||"")}</textarea>
  </div>`;

  return html;
}

function scheduleContentRetest(taskId, days) {
  const due = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
  updateContentTaskField(taskId, { retest_due_at: due, retest_status: "waiting", status: "waiting_retest" });
}
function scheduleContentRetestCustom(taskId) {
  const input = document.getElementById(`retest-custom-${taskId}`);
  const v = input && input.value.trim();
  if (!v) return;
  updateContentTaskField(taskId, { retest_due_at: v, retest_status: "waiting", status: "waiting_retest" });
}

function renderContentPreviewModal() {
  const p = state.contentPreview;
  if (!p) return "";
  const s = p.suggestion;
  return `<div class="modal-overlay" onclick="if(event.target===this) closeContentPreview()">
    <div class="modal-box">
      <h3>加入内容矩阵 — 确认信息</h3>
      <div class="form-row"><label>标题</label><input type="text" value="${escapeHtml(s.title)}" onchange="editContentPreviewField('title', this.value)" /></div>
      <div style="display:flex;gap:10px;">
        <div class="form-row" style="flex:1;"><label>内容集群</label><input type="text" value="${escapeHtml(contentMetaLabel('cluster', s.content_cluster))}" disabled /></div>
        <div class="form-row" style="flex:1;"><label>优先级</label>
          <select onchange="editContentPreviewField('priority', this.value)">
            ${["P1","P2","P3"].map(pr => `<option value="${pr}" ${s.priority===pr?"selected":""}>${pr}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="qa-meta" style="margin-top:0;">目标Query</div>
      <div style="font-size:13px;margin:4px 0 8px;">${escapeHtml(s.target_query || "-")}</div>
      <div class="qa-meta" style="margin-top:0;">当前基线</div>
      <div style="display:flex;gap:8px;margin:4px 0 8px;flex-wrap:wrap;">
        <span class="badge" style="background:#F5F6F1;">品牌提及：${s.baseline_brand_mentioned?"是":"否"}</span>
        <span class="badge" style="background:#F5F6F1;">推荐：${s.baseline_recommended?"是":"否"}</span>
        <span class="badge" style="background:#F5F6F1;">排名：${s.baseline_rank!=null?s.baseline_rank:"--"}</span>
      </div>
      <div class="qa-meta" style="margin-top:0;">对应GEO Gap</div>
      <div style="margin:4px 0 8px;">${(s.geo_gaps||[]).map(g=>`<span class="type-tag">${escapeHtml(g)}</span>`).join("") || "无"}</div>
      <div class="qa-meta" style="margin-top:0;">建议内容角度</div>
      <div style="font-size:13px;margin:4px 0 8px;">${escapeHtml(s.content_angle || "")}</div>

      ${p.similar_tasks.length ? `
        <div style="background:#C7860714;border-radius:8px;padding:10px 12px;margin-top:10px;">
          <div style="font-size:13px;font-weight:600;color:#C78607;margin-bottom:6px;">发现相似内容任务</div>
          ${p.similar_tasks.map(t => `
            <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;">
              <input type="radio" name="merge-target" value="${t.id}" ${p.mergeTargetId===t.id?"checked":""} onchange="setContentPreviewMerge(this.value)" />
              《${escapeHtml(t.title)}》相似度 ${Math.round(t.similarity*100)}%
            </label>
          `).join("")}
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;">
            <input type="radio" name="merge-target" value="" ${!p.mergeTargetId?"checked":""} onchange="setContentPreviewMerge('')" />
            不合并，创建新任务
          </label>
        </div>
      ` : ""}

      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button class="btn-ghost" onclick="closeContentPreview()">取消</button>
        <button class="btn" onclick="confirmContentPreview()">${p.mergeTargetId ? "合并到现有任务" : "创建内容任务"}</button>
      </div>
    </div>
  </div>`;
}

function renderContentBatchModal() {
  const b = state.contentBatch;
  if (!b) return "";
  return `<div class="modal-overlay" onclick="if(event.target===this) closeBatchSuggestModal()">
    <div class="modal-box" style="max-width:720px;">
      <h3>生成内容矩阵建议</h3>
      <div class="qa-meta" style="margin-top:0;">已把相似的未覆盖Query聚合成 ${b.suggestions.length} 条建议，勾选后批量加入内容矩阵。</div>
      <div style="max-height:400px;overflow-y:auto;margin-top:10px;">
        ${b.suggestions.map((s, i) => `
          <div style="border:1px solid #E4E6DE;border-radius:8px;padding:10px 12px;margin-bottom:8px;">
            <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer;">
              <input type="checkbox" ${b.selected.has(i)?"checked":""} onchange="toggleBatchSuggestSelected(${i})" style="margin-top:3px;" />
              <span>
                ${contentPriorityBadge(s.priority)}
                <b>${escapeHtml(s.title)}</b>
                <div class="qa-meta" style="margin-top:2px;">覆盖Query：${s.covered_query_count}　对应Gap：${(s.geo_gaps||[]).join("、") || "无"}</div>
              </span>
            </label>
          </div>
        `).join("")}
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
        <button class="btn-ghost" onclick="closeBatchSuggestModal()">取消</button>
        <button class="btn" onclick="confirmBatchSuggest()">批量加入内容矩阵（已选 ${b.selected.size} 条）</button>
      </div>
    </div>
  </div>`;
}

function renderContentMatrix() {
  // 注意：预览弹窗/批量建议弹窗是全局的，由主 render() 统一追加，这里不重复渲染。
  if (state.contentTaskDetail) {
    return renderContentTaskDetailView(state.contentTaskDetail.task, state.contentTaskDetail.comparison);
  }

  let html = "";
  if (state.contentMessages) {
    html += `<div class="banner-error">${state.contentMessages.map(m => escapeHtml(m)).join("<br/>")}</div>`;
  }
  html += renderContentDashboardCards();
  html += renderContentFiltersBar();

  const tasks = state.contentTasks;
  if (tasks === null) {
    html += `<div class="card"><div class="qa-meta">加载中…</div></div>`;
  } else {
    html += state.contentView === "kanban" ? renderContentTaskKanbanView(tasks) : renderContentTaskListView(tasks);
  }

  return html;
}

function renderSettings() {
  const cur = d();
  return `<div class="card"><h3>系统信息</h3>
    <div style="font-size:13px;color:#6B6E64;line-height:1.9;">
      当前市场：${state.market==='cn'?'中国市场':'海外市场'}<br/>
      品牌：${cur.brand.name}　行业：${cur.brand.industry}　语言：${cur.brand.lang}<br/>
      后端地址：${location.origin}（前端和后端同源部署，无需单独配置）<br/>
      平台连接状态请前往「平台管理」页面查看。
    </div>
  </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// brand_parser 的 competitors 现在是 Precision First 结构化数据
// {name, aliases, confidence, evidence}，统一转成"中文名 / 英文别名"展示。
function competitorDisplayName(c) {
  if (c.aliases && c.aliases.length) return c.name + " / " + c.aliases[0];
  return c.name;
}

function render() {
  renderSidebar();
  document.getElementById("breadcrumb").textContent =
    (state.market==='cn'?'中国市场':'海外市场') + " / " + NAV_ITEMS.find(n=>n.id===state.page).label;

  const routes = {
    dashboard: renderDashboard, quick: renderQuick, deep: renderDeep, bank: renderBank,
    tutorial: renderTutorial,
    competitors: renderCompetitors,
    citations: () => emptyState("暂无引用来源数据","完成真实AI平台诊断后，将在此展示各平台回答中引用的来源站点及频次。"),
    content: renderContentMatrix,
    history: renderHistoryPage,
    reports: () => emptyState("暂无可用报告","生成报告需要先完成至少一次真实AI平台诊断。"),
    platforms: renderPlatforms,
    settings: renderSettings,
  };
  // "加入内容矩阵"预览弹窗 / 批量建议弹窗 是全局的：可能从深度诊断、快速诊断等
  // 任意页面触发，不能只挂在GEO内容矩阵自己的页面里，否则从别的页面点开时
  // 弹窗压根不会被渲染出来。
  document.getElementById("content").innerHTML =
    routes[state.page]() + renderContentPreviewModal() + renderContentBatchModal();
}

/* ---------------- 启动 ---------------- */
render();
checkDeepSeekStatus();
loadDashboardLatest(); // 默认页就是 Dashboard，开机先拉一次最新深度诊断数据
</script>
</body>
</html>
